  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عبد | بوتي</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
background: #0a0a15;
color: #fff;
font-family: 'Segoe UI', Tahoma, Arial;
line-height: 1.8;
overflow-x: hidden;
}

/* ====== شريط التنقل ====== */
.navbar {
position: fixed;
top: 0; left: 0; right: 0;
background: rgba(10,10,21,0.95);
backdrop-filter: blur(10px);
padding: 20px 40px;
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid #ffd70033;
z-index: 1000;
}
.navbar .logo {
color: #ffd700;
font-size: 24px;
font-weight: bold;
display: flex;
align-items: center;
gap: 10px;
}
.navbar ul {
list-style: none;
display: flex;
gap: 30px;
}
.navbar ul a {
color: #ccc;
text-decoration: none;
font-size: 16px;
transition: 0.3s;
position: relative;
}
.navbar ul a:hover { color: #ffd700; }
.navbar ul a::after {
content: '';
position: absolute;
bottom: -5px; right: 0;
width: 0; height: 2px;
background: #ffd700;
transition: 0.3s;
}
.navbar ul a:hover::after { width: 100%; }

/* ====== الهيرو ====== */
.hero {
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
padding: 120px 20px 60px;
position: relative;
background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0a0a15 70%);
}
.hero::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background-image:
radial-gradient(circle at 20% 30%, #ffd70011 0%, transparent 50%),
radial-gradient(circle at 80% 70%, #ffd70011 0%, transparent 50%);
animation: pulse 5s ease-in-out infinite;
}
@keyframes pulse {
0%, 100% { opacity: 0.5; }
50% { opacity: 1; }
}
.hero h1 {
font-size: 80px;
color: #ffd700;
margin-bottom: 20px;
position: relative;
animation: fadeInDown 1s ease;
text-shadow: 0 0 30px #ffd70055;
}
.hero p {
font-size: 24px;
color: #ccc;
margin-bottom: 40px;
position: relative;
animation: fadeInUp 1s ease 0.2s both;
}
.hero .buttons {
display: flex;
gap: 20px;
flex-wrap: wrap;
justify-content: center;
position: relative;
animation: fadeInUp 1s ease 0.4s both;
}

/* ====== الأزرار ====== */
.btn {
background: #ffd700;
color: #000;
padding: 15px 40px;
border-radius: 12px;
text-decoration: none;
font-size: 18px;
font-weight: bold;
display: inline-flex;
align-items: center;
gap: 10px;
transition: 0.3s;
border: 2px solid #ffd700;
box-shadow: 0 0 20px #ffd70044;
}
.btn:hover {
background: #fff;
transform: translateY(-5px);
box-shadow: 0 10px 40px #ffd70088;
}
.btn-outline {
background: transparent;
color: #ffd700;
}
.btn-outline:hover { background: #ffd700; color: #000; }

/* ====== الأقسام ====== */
.section {
padding: 80px 40px;
max-width: 1200px;
margin: 0 auto;
}
.section h2 {
font-size: 40px;
color: #ffd700;
margin-bottom: 40px;
text-align: center;
position: relative;
padding-bottom: 20px;
}
.section h2::after {
content: '';
position: absolute;
bottom: 0; left: 50%;
transform: translateX(-50%);
width: 80px; height: 4px;
background: #ffd700;
border-radius: 2px;
}

/* ====== الإحصائيات ====== */
.stats {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 25px;
}
.stat {
background: linear-gradient(135deg, #1a1a2e, #252540);
padding: 40px 20px;
border-radius: 20px;
text-align: center;
border: 1px solid #ffd70033;
transition: 0.3s;
position: relative;
overflow: hidden;
}
.stat:hover {
transform: translateY(-10px);
border-color: #ffd700;
box-shadow: 0 20px 40px #ffd70022;
}
.stat i {
font-size: 40px;
color: #ffd700;
margin-bottom: 15px;
display: block;
}
.stat .number {
font-size: 45px;
color: #ffd700;
font-weight: bold;
display: block;
}
.stat .label {
font-size: 16px;
color: #aaa;
}
